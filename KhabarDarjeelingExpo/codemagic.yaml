workflows:
  android-free-apk:
    name: Khabar Darjeeling - Android APK (Free)
    max_build_duration: 60
    environment:
      node: 18
      java: 17
    scripts:
      - name: Install Expo CLI and EAS CLI
        script: |
          npm install -g expo-cli eas-cli

      - name: Install dependencies
        script: npm install

      - name: Build Android APK with Expo
        script: |
          npx expo prebuild --platform android --clean
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

    artifacts:
      - android/app/build/outputs/apk/debug/app-debug.apk

    publishing:
      email:
        recipients:
          - limbunowan1234@gmail.com
        notify:
          success: true
          failure: true
