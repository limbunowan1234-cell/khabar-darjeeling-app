workflows:
  android-free-apk:
    name: Khabar Darjeeling Android
    max_build_duration: 60
    environment:
      node: 18
      java: 17
    scripts:
      - name: Install dependencies
        script: |
          cd KhabarDarjeelingExpo
          npm install
      - name: Expo prebuild
        script: |
          cd KhabarDarjeelingExpo
          npx expo prebuild --platform android --clean
      - name: Build APK
        script: |
          cd KhabarDarjeelingExpo/android
          chmod +x gradlew
          ENTRY_FILE=node_modules/expo-router/entry.js ./gradlew assembleRelease --no-daemon -x lint
          # Find and rename whatever APK was produced
          find app/build/outputs/apk/release/ -name "*.apk" -exec mv {} app/build/outputs/apk/release/KhabarDarjeeling-v1.0.0.apk \;
    artifacts:
      - KhabarDarjeelingExpo/android/app/build/outputs/apk/release/KhabarDarjeeling-v1.0.0.apk
    publishing:
      email:
        recipients:
          - limbunowan1234@gmail.com
        notify:
          success: true
          failure: true
