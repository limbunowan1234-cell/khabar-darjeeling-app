workflows:
  android-free-apk:
    name: Khabar Darjeeling Android
    max_build_duration: 60
    environment:
      node: 18
      java: 17
    scripts:
      - name: Install dependencies
        script: |
          cd KhabarDarjeelingExpo
          npm install
      - name: Expo prebuild
        script: |
          cd KhabarDarjeelingExpo
          npx expo prebuild --platform android --clean --no-install
      - name: Build APK
        script: |
          cd KhabarDarjeelingExpo/android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
    artifacts:
      - KhabarDarjeelingExpo/android/app/build/outputs/apk/debug/app-debug.apk
    publishing:
      email:
        recipients:
          - limbunowan1234@gmail.com
        notify:
          success: true
          failure: true
