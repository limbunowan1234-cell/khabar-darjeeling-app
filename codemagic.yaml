workflows:
  android-free-apk:
    name: Khabar Darjeeling Android
    max_build_duration: 60
    environment:
      node: 18
      java: 17
    scripts:
      - name: Install dependencies
        script: |
          cd KhabarDarjeelingExpo
          npm install
      - name: Expo prebuild
        script: |
          cd KhabarDarjeelingExpo
          npx expo prebuild --platform android --clean
      - name: Bundle JS
        script: |
          cd KhabarDarjeelingExpo
          mkdir -p android/app/src/main/assets
          npx react-native bundle \
            --platform android \
            --dev false \
            --entry-file node_modules/expo-router/entry.js \
            --bundle-output android/app/src/main/assets/index.android.bundle \
            --assets-dest android/app/src/main/res
      - name: Build APK
        script: |
          cd KhabarDarjeelingExpo/android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon -x lint
    artifacts:
      - KhabarDarjeelingExpo/android/app/build/outputs/apk/debug/app-debug.apk
    publishing:
      email:
        recipients:
          - limbunowan1234@gmail.com
        notify:
          success: true
          failure: true
