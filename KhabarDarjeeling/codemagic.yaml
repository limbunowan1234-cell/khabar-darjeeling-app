workflows:
  android-free-build:
    name: Khabar Darjeeling - Android APK
    max_build_duration: 60
    environment:
      node: 18
      java: 17
    scripts:
            - name: Install npm dependencies
        script: npm install

            - name: Install CocoaPods (skip on Android)
        script: echo "Skipping iOS pods for Android build"

            - name: Set up Android SDK
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties

            - name: Make gradlew executable
        script: chmod +x android/gradlew

            - name: Build Android debug APK (free - no signing needed)
        script: |
          cd android
          ./gradlew assembleDebug --no-daemon

    artifacts:
            - android/app/build/outputs/apk/debug/app-debug.apk

    publishing:
      email:
        recipients:
                    - limbunowan1234@gmail.com
        notify:
          success: true
          failure: true